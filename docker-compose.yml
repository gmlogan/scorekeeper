version: '3.8'

services:
  scorekeeper:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./backend/database:/app/database
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FRONTEND_URL=http://localhost
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development services (comment out for production)
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev-backend
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
    profiles: ["dev"]

  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5001
      - VITE_WS_URL=http://localhost:5001
    profiles: ["dev"]
